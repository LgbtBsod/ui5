<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PCCT Test Suite</title>
</head>
<body>
    <script
        src="/resources/sap-ui-core.js"
        id="sap-ui-bootstrap"
        data-sap-ui-theme="sap_fiori_3"
        data-sap-ui-async="true"
        data-sap-ui-libs="sap.ui.core,sap.m"
        data-sap-ui-resourceroots='{"PRODUCTION_CONTROL_CHECKLIST":"../"}'>
    </script>
    <script>
        sap.ui.getCore().attachInit(function () {
            sap.ui.require(["sap/ui/test/starter/runTest"], function (runTest) {
                runTest({
                    pages: [
                        {
                            title: "Unit tests",
                            qunit: "unit/unitTests.qunit.html"
                        },
                        {
                            title: "OPA tests",
                            qunit: "integration/opaTests.qunit.html"
                        }
                    ]
                });
            });
        });
    </script>
</body>
</html>
