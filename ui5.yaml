specVersion: "3.0"
metadata:
  name: production-control-checklist
type: application
framework:
  name: SAPUI5
  version: "1.71.70"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.f
    - name: sap.ui.layout
    - name: sap.ui.comp
    - name: sap.ui.table
    - name: sap.ui.unified
    - name: sap.uxap
    - name: sap.viz
resources:
  configuration:
    paths:
      webapp: app
builder:
  componentPreload:
    namespaces:
      - PRODUCTION_CONTROL_CHECKLIST
  resources:
    excludes:
      - "/test/**"

# Productive baseline is UI5 1.71.28. Local UI5 Tooling stays on 1.71.70 because SAPUI5 1.71.28 is not resolvable via the current framework package channel; bootstrap/test URLs remain externally constrained and are documented in README_BUILD_AND_VALIDATE.md.
