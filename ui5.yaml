specVersion: "3.0"
metadata:
  name: production-control-checklist
type: application
framework:
  name: SAPUI5
  version: "1.71.74"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.f
    - name: sap.ui.layout
    - name: sap.ui.comp
    - name: sap.ui.table
    - name: sap.ui.unified
    - name: sap.uxap
    - name: sap.viz
resources:
  configuration:
    paths:
      webapp: app
builder:
  componentPreload:
    namespaces:
      - PRODUCTION_CONTROL_CHECKLIST
  resources:
    excludes:
      - "/test/**"

# B-02 STATUS: Local tooling is pinned to the productive SAPUI5 1.71 LTS line.
# Productive BASIS must expose the exact same or newer 1.71 patch via
# /sap/public/bc/ui5_ui5/1/resources/sap-ui-version.json before deployment.
