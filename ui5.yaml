specVersion: "3.0"
metadata:
  name: production-control-checklist
type: application
framework:
  name: SAPUI5
  version: "1.76.0"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.f
    - name: sap.ui.layout
    - name: sap.ui.comp
    - name: sap.ui.table
    - name: sap.ui.unified
    - name: sap.uxap
    - name: sap.viz
resources:
  configuration:
    paths:
      webapp: app
builder:
  componentPreload:
    namespaces:
      - PRODUCTION_CONTROL_CHECKLIST
  resources:
    excludes:
      - "/test/**"

