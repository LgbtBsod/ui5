[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pylint.MASTER]
max-line-length = 120
ignore = ['.git', '.pytest_cache', '__pycache__', 'tests']

[tool.pylint.DESIGN]
max-args = 7
max-locals = 25
max-returns = 8
max-branches = 15
max-statements = 60

[tool.pylint.FORMAT]
max-module-lines = 500
indent-string = '    '

[tool.pylint.'MESSAGES CONTROL']
disable = [
    'C0114',  # missing-module-docstring
    'C0115',  # missing-class-docstring
    'C0116',  # missing-function-docstring
    'R0903',  # too-few-public-methods
    'W0511',  # fixme
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
no_strict_optional = true
check_untyped_defs = true

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
